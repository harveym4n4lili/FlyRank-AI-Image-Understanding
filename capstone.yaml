# Manifest read by the capstone evaluator.
name: ai-image-understanding
run: docker compose up --build -d
seed: docker compose exec -T api node dist/db/seed.js
test: npm test
base_url: http://localhost:3000
# All endpoints except /health need the header X-Api-Key: <DEMO_API_KEY from .env>
endpoints:
  - GET /health
  - POST /jobs/ingest-images
  - GET /jobs/:id
  - GET /images
  - GET /images/:id
  - GET /costs
  - GET /costs/summary
  - POST /jobs/embed-images
  - POST /jobs/embed-posts
  - POST /posts
  - GET /posts
  - GET /posts/:id
  - GET /posts/:id/images
  - POST /posts/:id/images/:imageId/check
  - GET /review
  - GET /review.html
  - GET /suggestions/:id
  - POST /suggestions/:id/approve   # header Idempotency-Key
  - POST /suggestions/:id/reject    # header Idempotency-Key
  - GET /images/:id/file
# Eval (host, stack running, corpus tagged): npm run eval   → top-1 precision, same number as the README
