services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: imagematch
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d imagematch"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://app:app@db:5432/imagematch
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "dist/worker/index.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://app:app@db:5432/imagematch
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
