x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://app:app@db:5432/imagematch
    DATA_DIR: /app/data
  volumes:
    - ./data:/app/data:ro

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: imagematch
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d imagematch"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies drizzle/ migrations, then exits. api and worker wait for it.
  migrate:
    <<: *app
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["node", "dist/worker/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
